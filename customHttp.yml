# Revalidate every entry URL (including / and client routes) and mutable files.
# JS and Wasm also have matching content-hashed filenames, so an old binary
# cached under the previous /pkg/loopseed_bg.wasm URL cannot be reused by new JS.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
