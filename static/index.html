<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Loopseed researches lasting learning in computational systems. Explore evidence from the Fish testbed, scientific methods, and future research.">
  <title>Loopseed — Toward Intelligence that keeps Learning</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Adamina&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="modulepreload" href="/pkg/loopseed.js">
</head>
<body>
  <div id="boot" class="boot" aria-live="polite">
    <div class="boot-content">
      <div class="boot-text">Loading Loopseed…</div>
      <p id="boot-retry" hidden><button class="btn" type="button">Try again</button></p>
      <p><a href="/papers/dynamical-synthesis.html">Dynamical Synthesis: Learning through Interaction</a></p>
      <noscript><p class="boot-noscript">The paper and supporting evidence are available above. The interactive research site uses JavaScript and WebAssembly.</p></noscript>
    </div>
  </div>
  <script type="module">
    const retry = document.getElementById('boot-retry');
    retry.querySelector('button').addEventListener('click', () => location.reload());
    const slowLoad = setTimeout(() => {
      document.querySelector('.boot-text').textContent = 'Loopseed is taking longer to load. You can retry or read the paper below.';
      retry.hidden = false;
    }, 20000);
    try {
      const { default: init } = await import('/pkg/loopseed.js');
      await init();
      const b = document.getElementById('boot');
      if (b) b.remove();
    } catch (err) {
      const t = document.querySelector('.boot-text');
      if (t) t.textContent = 'Loopseed could not load. Please try again, or read the paper below.';
      retry.hidden = false;
      console.error(err);
    } finally {
      clearTimeout(slowLoad);
    }
  </script>
</body>
</html>
