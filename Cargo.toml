[workspace]
resolver = "2"
members = ["crates/record", "crates/site"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Dilate Technologies"]
description = "loopseed.io — the Loopseed research program, its measured results, and its research goals"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
